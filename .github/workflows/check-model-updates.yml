name: Check model updates

# Weekly check of upstream HuggingFace repos for newer versions of the anime
# upscaling model weights this project mirrors. If newer files are found,
# they are downloaded and published as a fresh GitHub Release so the Colab
# notebook (which only ever downloads from this repo's Releases) picks them
# up automatically.
#
# Safety properties:
#   - HuggingFace unreachable                    -> exit 0, do nothing.
#   - Upstream unchanged                         -> exit 0, do nothing.
#   - Upstream newer                             -> new Release published.
#   - Publish itself fails                       -> job fails loudly (red X).
#
# In every one of those cases the Colab notebook is unaffected as long as at
# least one Release exists — that's the whole point of decoupling from HF.

on:
  schedule:
    # Every Monday at 04:17 UTC. Odd minute to avoid the top-of-hour rush.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a new Release even if nothing changed upstream (use for seeding)."
        required: false
        default: "false"

permissions:
  contents: write   # needed to create Releases

concurrency:
  group: check-model-updates
  cancel-in-progress: false

jobs:
  check-and-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step: fetch_latest_weights.py deliberately uses only
      # the Python standard library, so the mirror pipeline has no external
      # runtime dependencies of its own.

      - name: Check HuggingFace and mirror if newer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/fetch_latest_weights.py \
            --repo "${{ github.repository }}" \
            $FORCE_FLAG
